<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서비스 점검 안내</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #202124;
    }

    main {
      width: min(520px, 100%);
      padding: 48px 32px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .date {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      background: #f1f3f5;
      border-radius: 999px;
      font-weight: 600;
    }

    p {
      margin: 8px 0;
      line-height: 1.7;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <main>
    <h1>하드웨어 고장으로 잠시 쉬어갑니다</h1>
    <div class="date">목표 7월 27일 · 최대 7월 30일</div>
    <p>"부품을 찾고 있어요!"</p>
    <p>최대한 빠르게 돌아오겠습니다.</p>
  </main>
</body>
</html>
