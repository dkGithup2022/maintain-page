<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서비스 점검 안내</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #202124;
    }

    main {
      width: min(520px, 100%);
      padding: 48px 32px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .date {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      background: #f1f3f5;
      border-radius: 999px;
      font-weight: 600;
    }

    p {
      margin: 8px 0;
      line-height: 1.7;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <main>
    <h1>서비스 점검 중입니다</h1>
    <div class="date">점검 예정일: 7월 22일</div>
    <p>전기 설비 점검으로 인해 서비스 이용이 일시적으로 중단되었습니다.</p>
    <p>점검 완료 후 정상적으로 서비스를 재개하겠습니다.</p>
  </main>
</body>
</html>
